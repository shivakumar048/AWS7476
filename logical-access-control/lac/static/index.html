<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logical Access Control</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#5d6678; --line:#dde1e8; --accent:#2457d6; --ok:#137a3a; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --panel:#1b2029; --text:#e6e9ef; --muted:#9aa3b5; --line:#2c3340; --accent:#7aa2ff; --ok:#4ccb7a; --bad:#ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:16px; margin:0; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
  input, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { font-family:ui-monospace, monospace; min-height:70px; }
  button { padding:8px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; margin-top:10px; }
  button.link { background:none; color:var(--accent); padding:0; margin:0; }
  nav { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
  nav button { background:var(--panel); color:var(--text); border:1px solid var(--line); margin:0; }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; font-size:12px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:640px) { .row { grid-template-columns:1fr; } }
  .verdict { font-size:18px; font-weight:700; }
  .allow { color:var(--ok); } .deny { color:var(--bad); }
  .err { color:var(--bad); margin-top:8px; }
  .hidden { display:none; }
  .tablewrap { overflow-x:auto; }
  td code { word-break:break-all; font-size:12px; }
</style>
</head>
<body>
<header><h1>Logical Access Control</h1><span id="who"></span></header>
<main>
  <section id="login" class="panel" style="max-width:360px;margin:40px auto">
    <form id="loginForm">
      <label for="u">Username</label><input id="u" autocomplete="username" required>
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div id="loginErr" class="err"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <nav>
      <button data-tab="check" class="active">Check access</button>
      <button data-tab="me">My access</button>
      <button data-tab="users">Users</button>
      <button data-tab="policies">Policies</button>
      <button data-tab="audit">Audit trail</button>
    </nav>

    <div id="tab-check" class="panel">
      <form id="checkForm">
        <div class="row">
          <div><label for="cPrincipal">Principal (blank = yourself)</label><input id="cPrincipal"></div>
          <div><label for="cAction">Action</label><input id="cAction" value="ec2:StartInstances" required></div>
        </div>
        <label for="cResource">Resource</label><input id="cResource" value="arn:aws:ec2:us-east-1:123456789012:instance/i-0abc" required>
        <label for="cContext">Request context (JSON)</label><textarea id="cContext">{"resource:tag/team": "platform"}</textarea>
        <button type="submit">Evaluate</button>
      </form>
      <div id="checkOut"></div>
    </div>

    <div id="tab-me" class="panel hidden"><pre id="meOut"></pre></div>
    <div id="tab-users" class="panel hidden"><div class="tablewrap"><table id="usersTbl"></table></div><div id="usersErr" class="err"></div></div>
    <div id="tab-policies" class="panel hidden"><div id="polOut"></div></div>
    <div id="tab-audit" class="panel hidden">
      <div id="auditVerify"></div>
      <div class="tablewrap"><table id="auditTbl"></table></div><div id="auditErr" class="err"></div>
    </div>
  </section>
</main>
<script>
let token = null;
try { token = sessionStorage.getItem("lacToken"); } catch (e) {}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (res.status === 401 && path !== "/api/login") { signOut(); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function signOut() {
  token = null;
  try { sessionStorage.removeItem("lacToken"); } catch (e) {}
  $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("who").innerHTML = "";
}

async function showApp() {
  const me = await api("GET", "/api/me");
  $("who").innerHTML = esc(me.user) + ' · <button class="link" id="logout">Sign out</button>';
  $("logout").onclick = async () => { try { await api("POST", "/api/logout"); } catch (e) {} signOut(); };
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("meOut").textContent = JSON.stringify(me, null, 2);
}

$("loginForm").onsubmit = async (e) => {
  e.preventDefault(); $("loginErr").textContent = "";
  try {
    const r = await api("POST", "/api/login", { username: $("u").value, password: $("p").value });
    token = r.token;
    try { sessionStorage.setItem("lacToken", token); } catch (e) {}
    await showApp();
  } catch (err) { $("loginErr").textContent = err.message; }
};

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll("[id^=tab-]").forEach(t => t.classList.toggle("hidden", t.id !== "tab-" + b.dataset.tab));
  ({ me: loadMe, users: loadUsers, policies: loadPolicies, audit: loadAudit }[b.dataset.tab] || (() => {}))();
});

$("checkForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const ctx = $("cContext").value.trim() ? JSON.parse($("cContext").value) : {};
    const body = { action: $("cAction").value, resource: $("cResource").value, context: ctx };
    if ($("cPrincipal").value) body.principal = $("cPrincipal").value;
    const d = await api("POST", "/api/authorize", body);
    $("checkOut").innerHTML = `<p class="verdict ${d.allowed ? "allow" : "deny"}">${d.decision.toUpperCase()}</p>
      <p>${esc(d.reason)}${d.matched_policy ? " — policy <b>" + esc(d.matched_policy) + "</b>" + (d.matched_sid ? " / " + esc(d.matched_sid) : "") : ""}</p>`;
  } catch (err) { $("checkOut").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
};

async function loadMe() { $("meOut").textContent = JSON.stringify(await api("GET", "/api/me"), null, 2); }

async function loadUsers() {
  $("usersErr").textContent = "";
  try {
    const users = await api("GET", "/api/users");
    $("usersTbl").innerHTML = "<tr><th>User</th><th>Groups</th><th>Roles</th><th>Status</th><th>Last login</th></tr>" +
      users.map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.groups.join(", "))}</td><td>${esc(u.roles.join(", "))}</td>
        <td>${u.disabled ? "disabled" : u.locked ? "locked" : "active"}${u.mfa_enabled ? " · MFA" : ""}</td><td>${esc(u.last_login || "never")}</td></tr>`).join("");
  } catch (err) { $("usersTbl").innerHTML = ""; $("usersErr").textContent = err.message; }
}

async function loadPolicies() {
  try {
    const pols = await api("GET", "/api/policies");
    $("polOut").innerHTML = Object.entries(pols).map(([n, p]) =>
      `<h3>${esc(n)}</h3><p>${esc(p.description)}</p><pre>${esc(JSON.stringify(p.document, null, 2))}</pre>`).join("");
  } catch (err) { $("polOut").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

async function loadAudit() {
  $("auditErr").textContent = "";
  try {
    const v = await api("GET", "/api/audit/verify");
    $("auditVerify").innerHTML = v.intact ? '<p class="allow">Hash chain intact</p>' : `<p class="deny">Tampering detected at entry ${v.first_bad_entry}</p>`;
    const rows = (await api("GET", "/api/audit?limit=200")).reverse();
    $("auditTbl").innerHTML = "<tr><th>Time</th><th>Event</th><th>Actor</th><th>Details</th></tr>" +
      rows.map(r => `<tr><td>${esc(r.timestamp.slice(0, 19))}</td><td>${esc(r.event)}</td><td>${esc(r.actor)}</td><td><code>${esc(JSON.stringify(r.details))}</code></td></tr>`).join("");
  } catch (err) { $("auditTbl").innerHTML = ""; $("auditErr").textContent = err.message; }
}

if (token) showApp().catch(signOut);
</script>
</body>
</html>
