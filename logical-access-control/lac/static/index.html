<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Control Console</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<div id="boot" class="boot">Loading…</div>

<section id="login-view" class="login hidden" aria-labelledby="login-title">
  <form id="login-form" class="login-card" novalidate>
    <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>Access Control</div>
    <h1 id="login-title">Sign in</h1>
    <label class="field"><span>Username</span><input id="login-user" name="username" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="form-error" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</section>

<div id="app-view" class="shell hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Access Control</div>
    <nav id="nav" aria-label="Main"></nav>
  </aside>
  <div id="scrim" class="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="Open menu">☰</button>
      <h1 id="page-title" class="page-title"></h1>
      <div class="topbar-right">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
        <a id="current-user" class="user-chip" href="#/me"></a>
        <button id="logout" class="btn btn-ghost btn-sm">Sign out</button>
      </div>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
</body>
</html>
